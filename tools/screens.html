<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:393px;height:852px;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:#fff;color:#111;overflow:hidden;-webkit-font-smoothing:antialiased}
.sb{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 44px;font-weight:600;font-size:17px;position:relative}
.island{position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;background:#000;border-radius:20px}
.ic{display:flex;gap:6px;align-items:center}
.nav{height:44px;display:flex;align-items:center;justify-content:center;position:relative;font-weight:600;font-size:17px}
.nav a{position:absolute;left:16px;color:#007aff;font-weight:400}
.chat{padding:8px 16px 0;display:flex;flex-direction:column;gap:14px}
.me{align-self:flex-end;width:78%;background:#f1f1f6;border-radius:18px;overflow:hidden}
.me img{display:block;width:100%;height:150px;object-fit:cover}
.me p{padding:12px 14px 14px;font-size:16px;line-height:1.35}
.bot{display:flex;gap:10px;align-items:flex-start}
.bot img{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.bot .b{background:#f1f1f6;border-radius:18px;padding:12px 14px;font-size:15px;line-height:1.42;max-width:300px}
.bot .b p+p{margin-top:9px}
.bot .b .kv{margin-top:9px}
.input{position:absolute;left:0;right:0;bottom:34px;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-top:1px solid #ececf0;color:#8e8e93;font-size:16px;background:#fff}
.home{position:absolute;bottom:9px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#111}
</style></head><body>
<div class="sb"><span>9:41</span><i class="island"></i><span class="ic">

<svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.2c2.4 0 4.6.9 6.3 2.5l1.2-1.2C14 1.5 11.4.5 8.5.5S3 1.5 1 3.5l1.2 1.2C3.9 3.1 6.1 2.2 8.5 2.2zm0 3.4c1.5 0 2.9.6 3.9 1.5l1.2-1.2C12.3 4.6 10.5 3.9 8.5 3.9S4.7 4.6 3.4 5.9l1.2 1.2c1-.9 2.4-1.5 3.9-1.5zm0 3.4c.6 0 1.2.2 1.6.6L8.5 11.2 6.9 9.6c.4-.4 1-.6 1.6-.6z"/></svg>
<svg width="27" height="13" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="#111" opacity=".4"/><rect x="2" y="2" width="18" height="8" rx="2"/><rect x="22.5" y="4" width="1.5" height="4" rx=".75" opacity=".4"/></svg>
</span></div>
<div class="nav"><a id="close"></a><span id="title"></span></div>
<div class="chat">
<div class="me"><img id="photo"><p id="q"></p></div>
<div class="bot"><img id="avatar"><div class="b" id="a"></div></div>
</div>

<i class="home"></i>
</body></html>
